name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build
        run: |
          ver="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags="-s -w -X main.Version=${ver} -X main.Commit=${GITHUB_SHA}" \
              -o dist/entrypool-linux-${arch} .
          done
          (cd dist && sha256sum entrypool-linux-* > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/entrypool-linux-amd64
            dist/entrypool-linux-arm64
            dist/SHA256SUMS
